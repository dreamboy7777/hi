<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MYKELS SPACE | ABSOLUTE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root { --neon: #a78bfa; --bg: #020617; }
        body { 
            background: var(--bg); color: #cbd5e1; min-height: 100vh; margin: 0; 
            overflow-x: hidden; font-family: 'Inter', sans-serif;
            background-size: cover; background-position: center; transition: background 1s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(to bottom, rgba(2, 6, 23, 0.4), rgba(2, 6, 23, 0.9));
            z-index: -1; pointer-events: none;
        }
        .gpu { transform: translateZ(0); backface-visibility: hidden; will-change: transform, opacity; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.05); }
        .neon-border { border: 1px solid rgba(167, 139, 250, 0.3); box-shadow: 0 0 20px rgba(139, 92, 246, 0.1); }
        .neon-text { text-shadow: 0 0 10px rgba(167, 139, 250, 0.5); color: #c4b5fd; }
        .cursor { position: absolute; width: 12px; height: 12px; background: var(--neon); border-radius: 50%; pointer-events: none; z-index: 1000; transition: all 0.1s linear; box-shadow: 0 0 10px var(--neon); }
        .cursor-label { position: absolute; left: 15px; top: 0; font-size: 10px; white-space: nowrap; color: #fff; font-weight: bold; }
        .emoji { position: absolute; pointer-events: none; z-index: 100; animation: fall 4s linear forwards; font-size: 2rem; opacity: 0.8; }
        @keyframes fall { from { transform: translateY(-10vh) rotate(0deg); opacity: 0.8; } to { transform: translateY(110vh) rotate(360deg); opacity: 0; } }
        .dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); transition: all 0.4s ease; opacity: 0.8; z-index: 1000; width: 90%; max-width: 600px; }
        .fullscreen-active { position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; z-index: 9999 !important; background: black !important; border-radius: 0 !important; border: none !important; }
        .fullscreen-active video { width: 100vw !important; height: 100vh !important; object-fit: contain !important; }
        .fullscreen-active #banner-display { display: none !important; }
        .profile-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 3000; display: none; }
        .incoming-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 4000; display: none; }
    </style>
</head>
<body class="flex items-center justify-center p-4" style="background-image: url('https://64.media.tumblr.com/2483e015d5da16768b0b8aedc4514872/tumblr_mwsonxHV4N1qi6frjo1_540.png');">
    <div class="overlay"></div>

    <!-- JOIN SCREEN -->
    <div id="join-screen" class="gpu glass p-10 rounded-[2.5rem] neon-border w-full max-w-md flex flex-col gap-8 z-10">
        <div class="text-center">
            <h1 class="text-4xl font-light neon-text italic tracking-tight mb-1">mykels space</h1>
            <p class="text-slate-500 text-[10px] uppercase tracking-widest font-medium">Absolute P2P Suite</p>
        </div>
        <div class="flex flex-col gap-6">
            <div class="flex flex-col gap-2">
                <label class="text-[10px] font-medium text-slate-500 uppercase ml-1">Identity</label>
                <input id="user-name" class="bg-slate-900/40 border border-slate-800 p-4 rounded-2xl text-slate-200 outline-none transition" placeholder="Who are you?">
            </div>
            <div class="flex flex-col gap-4 p-4 rounded-2xl bg-slate-900/30 border border-slate-800">
                <label class="text-[10px] font-medium text-slate-500 uppercase text-center">Profile Setup</label>
                <div class="flex flex-col items-center gap-4">
                    <div class="relative">
                        <img id="pfp-preview" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Default" class="w-20 h-20 rounded-full border border-slate-700 p-1 object-cover opacity-80">
                        <input type="file" id="pfp-upload" accept="image/*" class="hidden">
                        <button id="pfp-btn" class="absolute -bottom-2 -right-2 bg-slate-800 text-slate-400 p-2 rounded-full text-xs hover:text-white transition">📷</button>
                    </div>
                    <div class="flex flex-col gap-2 w-full">
                        <input type="file" id="banner-upload" accept="image/*" class="bg-slate-900/60 border border-slate-800 p-2 rounded-lg text-xs text-slate-300 outline-none cursor-pointer">
                        <input id="user-desc" class="bg-slate-900/60 border border-slate-800 p-2 rounded-lg text-xs text-slate-300 outline-none" placeholder="About me... (Bio)">
                    </div>
                </div>
            </div>
            <div class="flex flex-col gap-2">
                <label class="text-[10px] font-medium text-slate-500 uppercase ml-1">Access Code</label>
                <input id="room-pass" type="text" class="bg-slate-900/40 border border-slate-800 p-4 rounded-2xl text-slate-200 outline-none transition" placeholder="Type room code or custom ID...">
            </div>
            <button id="start-btn" class="bg-slate-800 text-slate-400 p-4 rounded-2xl font-medium transition-all active:scale-95 shadow-sm cursor-pointer hover:bg-purple-900 hover:text-white">Enter Space</button>
        </div>
    </div>

    <!-- MEETING ROOM -->
    <div id="meeting-room" class="hidden w-full max-w-7xl flex flex-col gap-6 h-screen max-h-[95vh]">
        <div class="flex justify-between items-center glass p-4 rounded-2xl neon-border gpu">
            <div class="flex items-center gap-3 cursor-pointer" onclick="openProfile('me')">
                <img id="my-pfp-display" class="w-10 h-10 rounded-full bg-slate-800 border border-slate-700 object-cover opacity-80">
                <div class="flex flex-col">
                    <p id="my-name-display" class="font-medium text-sm text-slate-300"></p>
                    <p id="my-id-display" class="text-[10px] text-slate-500 font-mono"></p>
                </div>
            </div>
            <div class="flex gap-2">
                <input id="peer-id" class="bg-slate-900/50 border border-slate-800 p-2 rounded-xl text-slate-300 text-sm outline-none" placeholder="Friend's ID...">
                <button id="connect-btn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl font-medium text-sm transition">Call Friend</button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 h-full overflow-hidden">
            <div id="video-container" class="lg:col-span-3 relative aspect-video bg-black rounded-[2rem] overflow-hidden border border-slate-800 shadow-2xl gpu">
                <div id="banner-display" class="absolute top-0 left-0 w-full h-16 bg-cover bg-center opacity-50 border-b border-slate-800 z-20"></div>
                <video id="remote-video" autoplay class="w-full h-full object-contain relative z-10" playsinline></video>
                <div id="cursor-layer"></div>
                <div id="emoji-layer"></div>
                <div id="status" class="absolute top-6 right-6 px-3 py-1 rounded-full text-[10px] font-bold uppercase bg-slate-900/80 text-slate-500 border border-slate-800 z-20">Disconnected</div>
            </div>
            <div class="flex flex-col gap-4 h-full">
                <div class="glass p-4 rounded-3xl border border-slate-800 flex flex-col h-1/2">
                    <h3 class="text-xs font-medium text-slate-500 uppercase mb-2">Encrypted Chat</h3>
                    <div id="chat-messages" class="flex-1 overflow-y-auto text-xs space-y-2 mb-2 pr-2"></div>
                    <div class="flex gap-2">
                        <input id="chat-input" class="bg-slate-900/50 border border-slate-800 p-2 rounded-lg text-slate-300 text-xs w-full outline-none" placeholder="Write something...">
                        <button id="send-msg" class="bg-slate-800 p-2 rounded-lg text-xs hover:bg-purple-900 transition text-slate-200">Send</button>
                    </div>
                </div>
                <div class="glass p-4 rounded-3xl border border-slate-800 flex flex-col gap-3">
                    <h3 class="text-xs font-medium text-slate-500 uppercase mb-1">Controls</h3>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="sendSfx('airhorn')" class="bg-slate-900/50 p-2 rounded-lg text-[10px] hover:bg-slate-700 transition text-slate-300">📢 Airhorn</button>
                        <button onclick="sendSfx('bruh')" class="bg-slate-900/50 p-2 rounded-lg text-[10px] hover:bg-slate-700 transition text-slate-300">🤨 Bruh</button>
                        <button onclick="startMiniGame('coinflip')" class="bg-slate-900/50 p-2 rounded-lg text-[10px] hover:bg-slate-700 transition text-slate-300">🪙 Flip</button>
                        <button onclick="startMiniGame('dice')" class="bg-slate-900/50 p-2 rounded-lg text-[10px] hover:bg-slate-700 transition text-slate-300">🎲 Dice</button>
                    </div>
                    <div class="flex flex-col gap-2">
                        <button id="share-btn" class="w-full bg-slate-100 text-slate-900 p-3 rounded-xl font-bold hover:bg-white transition flex items-center justify-center gap-2 shadow-lg text-xs">
                            <span>📺</span> Share Screen
                        </button>
                        <button id="stop-share-btn" class="hidden w-full bg-red-600 text-white p-3 rounded-xl font-bold hover:bg-red-500 transition flex items-center justify-center gap-2 shadow-lg text-xs">
                            <span>🛑</span> Stop Sharing
                        </button>
                        <button id="fullscreen-btn" class="w-full bg-slate-800 text-slate-300 p-2 rounded-xl text-xs hover:bg-slate-700 transition">⤢ Fullscreen</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- LOCAL VIDEO (Hidden/Picture-in-Picture) -->
    <video id="local-video" autoplay muted playsinline class="hidden"></video>

    <!-- INCOMING CALL MODAL -->
    <div id="incoming-modal" class="incoming-modal glass p-6 rounded-3xl neon-border flex flex-col gap-4 text-center">
        <h3 class="text-lg font-medium text-white">Incoming Call</h3>
        <p id="caller-name" class="text-sm text-slate-400"></p>
        <div class="flex gap-4 justify-center">
            <button id="accept-call" class="bg-purple-600 text-white px-6 py-2 rounded-xl text-xs font-bold hover:bg-purple-500 transition">Accept</button>
            <button id="reject-call" class="bg-slate-800 text-slate-400 px-6 py-2 rounded-xl text-xs hover:bg-slate-700 transition">Decline</button>
        </div>
    </div>

    <!-- PROFILE MODAL -->
    <div id="profile-modal" class="profile-modal glass p-6 rounded-3xl neon-border flex flex-col gap-4 w-80">
        <div class="flex justify-between items-center">
            <h3 class="text-sm font-medium text-white uppercase">Profile</h3>
            <button onclick="closeProfile()" class="text-slate-400 hover:text-white text-xs">✕</button>
        </div>
        <div class="flex flex-col items-center gap-3">
            <img id="modal-pfp" class="w-16 h-16 rounded-full border border-slate-700 object-cover">
            <p id="modal-name" class="font-bold text-slate-200 text-sm"></p>
            <p id="modal-desc" class="text-xs text-slate-400 text-center"></p>
        </div>
    </div>

    <script>
        let peer, conn, currentCall;
        let localStream, screenStream;
        let myData = { name: '', pfp: '', desc: '', banner: '' };
        let remoteData = {};
        let secretKey = 'mykels-space-secret';

        const joinScreen = document.getElementById('join-screen');
        const meetingRoom = document.getElementById('meeting-room');
        const userNameInput = document.getElementById('user-name');
        const roomPassInput = document.getElementById('room-pass');
        const startBtn = document.getElementById('start-btn');
        const pfpPreview = document.getElementById('pfp-preview');
        const pfpUpload = document.getElementById('pfp-upload');
        const pfpBtn = document.getElementById('pfp-btn');
        const bannerUpload = document.getElementById('banner-upload');
        const userDescInput = document.getElementById('user-desc');
        const peerIdInput = document.getElementById('peer-id');
        const connectBtn = document.getElementById('connect-btn');
        const statusEl = document.getElementById('status');
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const sendMsgBtn = document.getElementById('send-msg');
        const shareBtn = document.getElementById('share-btn');
        const stopShareBtn = document.getElementById('stop-share-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const videoContainer = document.getElementById('video-container');
        const remoteVideo = document.getElementById('remote-video');
        const localVideo = document.getElementById('local-video');
        const bannerDisplay = document.getElementById('banner-display');
        const incomingModal = document.getElementById('incoming-modal');
        const profileModal = document.getElementById('profile-modal');

        pfpBtn.addEventListener('click', () => pfpUpload.click());
        pfpUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    myData.pfp = event.target.result;
                    pfpPreview.src = myData.pfp;
                };
                reader.readAsDataURL(file);
            }
        });

        bannerUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    myData.banner = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        startBtn.addEventListener('click', () => {
            const name = userNameInput.value.trim() || 'Anonymous';
            const customId = roomPassInput.value.trim();
            myData.name = name;
            myData.desc = userDescInput.value.trim() || 'No bio provided.';
            if (!myData.pfp) {
                myData.pfp = pfpPreview.src;
            }

            peer = customId ? new Peer(customId) : new Peer();

            peer.on('open', (id) => {
                document.getElementById('my-name-display').innerText = myData.name;
                document.getElementById('my-id-display').innerText = id;
                document.getElementById('my-pfp-display').src = myData.pfp;
                if (myData.banner) {
                    bannerDisplay.style.backgroundImage = `url(${myData.banner})`;
                }

                joinScreen.classList.add('hidden');
                meetingRoom.classList.remove('hidden');
                initMedia();
            });

            peer.on('connection', (incomingConn) => {
                conn = incomingConn;
                setupConnection();
            });

            peer.on('call', (incomingCall) => {
                currentCall = incomingCall;
                document.getElementById('caller-name').innerText = "Incoming video call...";
                incomingModal.style.display = 'block';

                document.getElementById('accept-call').onclick = () => {
                    incomingModal.style.display = 'none';
                    currentCall.answer(localStream);
                    currentCall.on('stream', (stream) => {
                        remoteVideo.srcObject = stream;
                        statusEl.innerText = "Connected";
                        statusEl.className = "absolute top-6 right-6 px-3 py-1 rounded-full text-[10px] font-bold uppercase bg-green-900/80 text-green-300 border border-green-800 z-20";
                    });
                };

                document.getElementById('reject-call').onclick = () => {
                    incomingModal.style.display = 'none';
                    currentCall.close();
                };
            });

            peer.on('error', (err) => {
                alert('Peer error: ' + err.type);
            });
        });

        async function initMedia() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
            } catch (err) {
                console.warn('Media devices not available:', err);
            }
        }

        connectBtn.addEventListener('click', () => {
            const peerId = peerIdInput.value.trim();
            if (!peerId) return alert('Enter a valid friend ID');

            conn = peer.connect(peerId);
            setupConnection();

            if (localStream) {
                currentCall = peer.call(peerId, localStream);
                currentCall.on('stream', (stream) => {
                    remoteVideo.srcObject = stream;
                    statusEl.innerText = "Connected";
                    statusEl.className = "absolute top-6 right-6 px-3 py-1 rounded-full text-[10px] font-bold uppercase bg-green-900/80 text-green-300 border border-green-800 z-20";
                });
            }
        });

        function setupConnection() {
            conn.on('open', () => {
                statusEl.innerText = "Connected";
                statusEl.className = "absolute top-6 right-6 px-3 py-1 rounded-full text-[10px] font-bold uppercase bg-green-900/80 text-green-300 border border-green-800 z-20";
                conn.send({ type: 'profile', data: myData });
            });

            conn.on('data', (data) => {
                if (data.type === 'profile') {
                    remoteData = data.data;
                    if (remoteData.banner) {
                        bannerDisplay.style.backgroundImage = `url(${remoteData.banner})`;
                    }
                } else if (data.type === 'chat') {
                    const decrypted = CryptoJS.AES.decrypt(data.payload, secretKey).toString(CryptoJS.enc.Utf8);
                    appendChat(data.sender, decrypted);
                } else if (data.type === 'sfx') {
                    playSfx(data.sound);
                } else if (data.type === 'minigame') {
                    appendChat('System', `${data.game}: ${data.result}`);
                } else if (data.type === 'cursor') {
                    updateRemoteCursor(data.x, data.y, data.name);
                }
            });

            conn.on('close', () => {
                statusEl.innerText = "Disconnected";
                statusEl.className = "absolute top-6 right-6 px-3 py-1 rounded-full text-[10px] font-bold uppercase bg-slate-900/80 text-slate-500 border border-slate-800 z-20";
                remoteVideo.srcObject = null;
            });
        }

        sendMsgBtn.addEventListener('click', sendChatMessage);
        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendChatMessage(); });

        function sendChatMessage() {
            const text = chatInput.value.trim();
            if (!text) return;
            appendChat('You', text);
            if (conn && conn.open) {
                const encrypted = CryptoJS.AES.encrypt(text, secretKey).toString();
                conn.send({ type: 'chat', sender: myData.name, payload: encrypted });
            }
            chatInput.value = '';
        }

        function appendChat(sender, text) {
            const div = document.createElement('div');
            div.innerHTML = `<span class="font-bold text-purple-400">${sender}:</span> <span class="text-slate-200">${text}</span>`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        shareBtn.addEventListener('click', async () => {
            try {
                screenStream = await navigator.mediaDevices.getDisplayMedia({ cursor: true });
                const videoTrack = screenStream.getVideoTracks()[0];
                if (currentCall && currentCall.peerConnection) {
                    const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
                    if (sender) sender.replaceTrack(videoTrack);
                }
                shareBtn.classList.add('hidden');
                stopShareBtn.classList.remove('hidden');

                videoTrack.onended = () => stopScreenShare();
            } catch (err) {
                console.error('Error sharing screen:', err);
            }
        });

        stopShareBtn.addEventListener('click', stopScreenShare);

        function stopScreenShare() {
            if (screenStream) {
                screenStream.getTracks().forEach(track => track.stop());
            }
            if (localStream && currentCall && currentCall.peerConnection) {
                const videoTrack = localStream.getVideoTracks()[0];
                const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
                if (sender) sender.replaceTrack(videoTrack);
            }
            stopShareBtn.classList.add('hidden');
            shareBtn.classList.remove('hidden');
        }

        fullscreenBtn.addEventListener('click', () => {
            videoContainer.classList.toggle('fullscreen-active');
        });

        function sendSfx(sound) {
            playSfx(sound);
            if (conn && conn.open) conn.send({ type: 'sfx', sound });
        }

        function playSfx(sound) {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            if (sound === 'airhorn') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);
            } else {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.3);
            }
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function startMiniGame(type) {
            let result = '';
            if (type === 'coinflip') {
                result = Math.random() < 0.5 ? 'Heads 🪙' : 'Tails 🪙';
            } else if (type === 'dice') {
                result = `Rolled a ${Math.floor(Math.random() * 6) + 1} 🎲`;
            }
            appendChat('System', `MiniGame (${type}): ${result}`);
            if (conn && conn.open) {
                conn.send({ type: 'minigame', game: type, result });
            }
        }

        function openProfile(target) {
            if (target === 'me') {
                document.getElementById('modal-pfp').src = myData.pfp;
                document.getElementById('modal-name').innerText = myData.name;
                document.getElementById('modal-desc').innerText = myData.desc;
            } else if (remoteData.name) {
                document.getElementById('modal-pfp').src = remoteData.pfp || 'https://api.dicebear.com/7.x/avataaars/svg?seed=Default';
                document.getElementById('modal-name').innerText = remoteData.name;
                document.getElementById('modal-desc').innerText = remoteData.desc || 'No bio provided.';
            } else {
                return;
            }
            profileModal.style.display = 'block';
        }

        function closeProfile() {
            profileModal.style.display = 'none';
        }

        document.addEventListener('mousemove', (e) => {
            if (conn && conn.open) {
                const x = e.clientX / window.innerWidth;
                const y = e.clientY / window.innerHeight;
                conn.send({ type: 'cursor', x, y, name: myData.name });
            }
        });

        function updateRemoteCursor(x, y, name) {
            const cursorLayer = document.getElementById('cursor-layer');
            let remoteCursor = document.getElementById('remote-cursor');
            if (!remoteCursor) {
                remoteCursor = document.createElement('div');
                remoteCursor.id = 'remote-cursor';
                remoteCursor.className = 'cursor';
                remoteCursor.innerHTML = `<div class="cursor-label">${name}</div>`;
                cursorLayer.appendChild(remoteCursor);
            }
            remoteCursor.style.left = `${x * window.innerWidth}px`;
            remoteCursor.style.top = `${y * window.innerHeight}px`;
        }
    </script>
</body>
</html>
