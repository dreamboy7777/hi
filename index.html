<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MYKELS SPACE | ABSOLUTE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root { --neon: #a78bfa; --bg: #020617; }
        body { 
            background: var(--bg); color: #cbd5e1; min-height: 100vh; margin: 0; 
            overflow-x: hidden; font-family: 'Inter', sans-serif;
            background-size: cover; background-position: center; transition: background 1s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(to bottom, rgba(2, 6, 23, 0.4), rgba(2, 6, 23, 0.9));
            z-index: -1; pointer-events: none;
        }
        .gpu { transform: translateZ(0); backface-visibility: hidden; will-change: transform, opacity; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.05); }
        .neon-border { border: 1px solid rgba(167, 139, 250, 0.3); box-shadow: 0 0 20px rgba(139, 92, 246, 0.1); }
        .neon-text { text-shadow: 0 0 10px rgba(167, 139, 250, 0.5); color: #c4b5fd; }
        .cursor { position: absolute; width: 12px; height: 12px; background: var(--neon); border-radius: 50%; pointer-events: none; z-index: 1000; transition: all 0.05s linear; box-shadow: 0 0 10px var(--neon); }
        .cursor-label { position: absolute; left: 15px; top: 0; font-size: 10px; white-space: nowrap; color: #fff; font-weight: bold; background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px; }
        .emoji { position: absolute; pointer-events: none; z-index: 100; animation: fall 4s linear forwards; font-size: 2rem; opacity: 0.8; }
        @keyframes fall { from { transform: translateY(-10vh) rotate(0deg); opacity: 0.8; } to { transform: translateY(110vh) rotate(360deg); opacity: 0; } }
        .fullscreen-active { position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; z-index: 9999 !important; background: black !important; border-radius: 0 !important; border: none !important; }
        .fullscreen-active video { width: 100vw !important; height: 100vh !important; object-fit: contain !important; }
        .fullscreen-active #banner-display { display: none !important; }
        .profile-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 3000; display: none; }
    </style>
</head>
<body class="flex items-center justify-center p-4" style="background-image: url('https://64.media.tumblr.com/2483e015d5da16768b0b8aedc4514872/tumblr_mwsonxHV4N1qi6frjo1_540.png');">
    <div class="overlay"></div>

    <!-- JOIN SCREEN -->
    <div id="join-screen" class="gpu glass p-10 rounded-[2.5rem] neon-border w-full max-w-md flex flex-col gap-8 z-10">
        <div class="text-center">
            <h1 class="text-4xl font-light neon-text italic tracking-tight mb-1">mykels space</h1>
            <p class="text-slate-500 text-[10px] uppercase tracking-widest font-medium">Absolute P2P Suite</p>
        </div>
        <div class="flex flex-col gap-6">
            <div class="flex flex-col gap-2">
                <label class="text-[10px] font-medium text-slate-500 uppercase ml-1">Identity</label>
                <input id="user-name" class="bg-slate-900/40 border border-slate-800 p-4 rounded-2xl text-slate-200 outline-none transition" placeholder="Who are you?">
            </div>
            <div class="flex flex-col gap-4 p-4 rounded-2xl bg-slate-900/30 border border-slate-800">
                <label class="text-[10px] font-medium text-slate-500 uppercase text-center">Profile Setup</label>
                <div class="flex flex-col items-center gap-4">
                    <div class="relative">
                        <img id="pfp-preview" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Default" class="w-20 h-20 rounded-full border border-slate-700 p-1 object-cover opacity-80 cursor-pointer">
                        <input type="file" id="pfp-upload" accept="image/*" class="hidden">
                        <button id="pfp-btn" class="absolute -bottom-2 -right-2 bg-slate-800 text-slate-400 p-2 rounded-full text-xs hover:text-white transition">📷</button>
                    </div>
                    <div class="flex flex-col gap-2 w-full">
                        <input type="file" id="banner-upload" accept="image/*" class="bg-slate-900/60 border border-slate-800 p-2 rounded-lg text-xs text-slate-300 outline-none cursor-pointer">
                        <input id="user-desc" class="bg-slate-900/60 border border-slate-800 p-2 rounded-lg text-xs text-slate-300 outline-none" placeholder="About me... (Bio)">
                    </div>
                </div>
            </div>
            <div class="flex flex-col gap-2">
                <label class="text-[10px] font-medium text-slate-500 uppercase ml-1">Access Code / Room ID</label>
                <input id="room-pass" type="text" class="bg-slate-900/40 border border-slate-800 p-4 rounded-2xl text-slate-200 outline-none transition" placeholder="Optional custom ID...">
            </div>
            <button id="start-btn" class="bg-slate-800 text-slate-400 p-4 rounded-2xl font-medium transition-all active:scale-95 shadow-sm cursor-pointer hover:bg-purple-900 hover:text-white">Enter Space</button>
        </div>
    </div>

    <!-- MEETING ROOM -->
    <div id="meeting-room" class="hidden w-full max-w-7xl flex flex-col gap-6 h-screen max-h-[95vh]">
        <div class="flex justify-between items-center glass p-4 rounded-2xl neon-border gpu">
            <div class="flex items-center gap-3 cursor-pointer" onclick="openProfile('me')">
                <img id="my-pfp-display" class="w-10 h-10 rounded-full bg-slate-800 border border-slate-700 object-cover opacity-80">
                <div class="flex flex-col">
                    <p id="my-name-display" class="font-medium text-sm text-slate-300"></p>
                    <p id="my-id-display" class="text-[10px] text-slate-500 font-mono"></p>
                </div>
            </div>
            <div class="flex gap-2">
                <input id="peer-id" class="bg-slate-900/50 border border-slate-800 p-2 rounded-xl text-slate-300 text-sm outline-none" placeholder="Friend's ID...">
                <button id="connect-btn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl font-medium text-sm transition cursor-pointer">Call Friend</button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 h-full overflow-hidden">
            <div id="video-container" class="lg:col-span-3 relative aspect-video bg-black rounded-[2rem] overflow-hidden border border-slate-800 shadow-2xl gpu">
                <div id="banner-display" class="absolute top-0 left-0 w-full h-16 bg-cover bg-center opacity-50 border-b border-slate-800 z-20 pointer-events-none"></div>
                <video id="remote-video" autoplay class="w-full h-full object-contain relative z-10" playsinline></video>
                <div id="cursor-layer" class="absolute inset-0 pointer-events-none z-30"></div>
                <div id="emoji-layer" class="absolute inset-0 pointer-events-none z-40"></div>
                <div id="status" class="absolute top-6 right-6 px-3 py-1 rounded-full text-[10px] font-bold uppercase bg-slate-900/80 text-slate-500 border border-slate-800 z-20">Disconnected</div>
            </div>
            <div class="flex flex-col gap-4 h-full">
                <div class="glass p-4 rounded-3xl border border-slate-800 flex flex-col h-1/2">
                    <h3 class="text-xs font-medium text-slate-500 uppercase mb-2">Encrypted Chat</h3>
                    <div id="chat-messages" class="flex-1 overflow-y-auto text-xs space-y-2 mb-2 pr-2"></div>
                    <div class="flex gap-2">
                        <input id="chat-input" class="bg-slate-900/50 border border-slate-800 p-2 rounded-lg text-slate-300 text-xs w-full outline-none" placeholder="Write something...">
                        <button id="send-msg" class="bg-slate-800 p-2 rounded-lg text-xs hover:bg-purple-900 transition text-slate-200 cursor-pointer">Send</button>
                    </div>
                </div>
                <div class="glass p-4 rounded-3xl border border-slate-800 flex flex-col gap-3">
                    <h3 class="text-xs font-medium text-slate-500 uppercase mb-1">Controls & Reactions</h3>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="sendEmoji('📢')" class="bg-slate-900/50 p-2 rounded-lg text-[10px] hover:bg-slate-700 transition text-slate-300 cursor-pointer">📢 Airhorn</button>
                        <button onclick="sendEmoji('🤨')" class="bg-slate-900/50 p-2 rounded-lg text-[10px] hover:bg-slate-700 transition text-slate-300 cursor-pointer">🤨 Bruh</button>
                        <button onclick="startMiniGame('coinflip')" class="bg-slate-900/50 p-2 rounded-lg text-[10px] hover:bg-slate-700 transition text-slate-300 cursor-pointer">🪙 Flip</button>
                        <button onclick="startMiniGame('dice')" class="bg-slate-900/50 p-2 rounded-lg text-[10px] hover:bg-slate-700 transition text-slate-300 cursor-pointer">🎲 Dice</button>
                    </div>
                    <div class="flex flex-col gap-2 mt-2">
                        <button id="share-btn" class="w-full bg-slate-100 text-slate-900 p-3 rounded-xl font-bold hover:bg-white transition flex items-center justify-center gap-2 shadow-lg text-xs cursor-pointer">
                            <span>📺</span> Share Screen
                        </button>
                        <button id="stop-share-btn" class="hidden w-full bg-red-600 text-white p-3 rounded-xl font-bold hover:bg-red-500 transition flex items-center justify-center gap-2 shadow-lg text-xs cursor-pointer">
                            <span>🛑</span> Stop Sharing
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- PROFILE MODAL -->
    <div id="profile-modal" class="profile-modal glass p-6 rounded-3xl neon-border w-80 flex flex-col gap-4">
        <div class="flex justify-between items-center">
            <h3 id="modal-title" class="text-xs font-medium text-slate-400 uppercase">Profile</h3>
            <button onclick="closeProfile()" class="text-slate-500 hover:text-white cursor-pointer">✕</button>
        </div>
        <div class="flex flex-col items-center gap-3">
            <img id="modal-pfp" class="w-20 h-20 rounded-full border border-slate-700 object-cover">
            <h4 id="modal-name" class="font-bold text-slate-200"></h4>
            <p id="modal-desc" class="text-xs text-slate-400 text-center"></p>
        </div>
    </div>

    <!-- APPLICATION SCRIPT -->
    <script>
        let peer, conn, localStream, currentCall;
        let myData = {
            name: 'Anonymous',
            desc: '',
            pfp: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Default',
            banner: ''
        };
        let peerData = {};
        const SECRET_KEY = "MYKELS_SPACE_SECRET_KEY";

        // Image upload handlers
        document.getElementById('pfp-btn').addEventListener('click', () => document.getElementById('pfp-upload').click());
        document.getElementById('pfp-upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    myData.pfp = event.target.result;
                    document.getElementById('pfp-preview').src = myData.pfp;
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('banner-upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    myData.banner = event.target.result;
                    document.body.style.backgroundImage = `url('${myData.banner}')`;
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            const nameInput = document.getElementById('user-name').value.trim();
            if (nameInput) myData.name = nameInput;
            myData.desc = document.getElementById('user-desc').value.trim();

            const customId = document.getElementById('room-pass').value.trim();
            
            initPeer(customId);

            document.getElementById('join-screen').classList.add('hidden');
            document.getElementById('meeting-room').classList.remove('hidden');

            document.getElementById('my-name-display').innerText = myData.name;
            document.getElementById('my-pfp-display').src = myData.pfp;
        });

        function initPeer(id) {
            peer = id ? new Peer(id) : new Peer();

            peer.on('open', (id) => {
                document.getElementById('my-id-display').innerText = id;
                updateStatus('Ready', 'text-amber-400');
            });

            peer.on('connection', (c) => {
                conn = c;
                setupConnection();
            });

            peer.on('call', (call) => {
                currentCall = call;
                navigator.mediaDevices.getDisplayMedia({ video: true, audio: true }).then(stream => {
                    localStream = stream;
                    call.answer(stream);
                    setupStreamListeners(call);
                }).catch(() => {
                    // Fallback to empty stream or audio if screen share denied
                    navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                        localStream = stream;
                        call.answer(stream);
                        setupStreamListeners(call);
                    }).catch(err => console.error(err));
                });
            });
        }

        document.getElementById('connect-btn').addEventListener('click', () => {
            const friendId = document.getElementById('peer-id').value.trim();
            if (!friendId) return;

            conn = peer.connect(friendId);
            setupConnection();

            navigator.mediaDevices.getDisplayMedia({ video: true, audio: true }).then(stream => {
                localStream = stream;
                const call = peer.call(friendId, stream);
                currentCall = call;
                setupStreamListeners(call);
            }).catch(() => {
                navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                    localStream = stream;
                    const call = peer.call(friendId, stream);
                    currentCall = call;
                    setupStreamListeners(call);
                });
            });
        });

        function setupConnection() {
            conn.on('open', () => {
                updateStatus('Connected', 'text-emerald-400');
                conn.send({ type: 'metadata', data: myData });
            });

            conn.on('data', (packet) => {
                if (packet.type === 'metadata') {
                    peerData = packet.data;
                    if (peerData.banner) {
                        document.getElementById('banner-display').style.backgroundImage = `url('${peerData.banner}')`;
                    }
                } else if (packet.type === 'chat') {
                    const decrypted = CryptoJS.AES.decrypt(packet.encrypted, SECRET_KEY).toString(CryptoJS.enc.Utf8);
                    appendChat(peerData.name || 'Friend', decrypted);
                } else if (packet.type === 'emoji') {
                    spawnEmoji(packet.emoji);
                } else if (packet.type === 'cursor') {
                    updatePeerCursor(packet.x, packet.y);
                }
            });
        }

        function setupStreamListeners(call) {
            call.on('stream', (remoteStream) => {
                const videoElement = document.getElementById('remote-video');
                videoElement.srcObject = remoteStream;
                updateStatus('Live', 'text-emerald-400');
            });
        }

        function updateStatus(text, colorClass) {
            const status = document.getElementById('status');
            status.innerText = text;
            status.className = `absolute top-6 right-6 px-3 py-1 rounded-full text-[10px] font-bold uppercase bg-slate-900/80 ${colorClass} border border-slate-800 z-20`;
        }

        // Chat functionality
        document.getElementById('send-msg').addEventListener('click', sendChatMessage);
        document.getElementById('chat-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendChatMessage();
        });

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !conn) return;

            const encrypted = CryptoJS.AES.encrypt(text, SECRET_KEY).toString();
            conn.send({ type: 'chat', encrypted });
            appendChat('You', text);
            input.value = '';
        }

        function appendChat(sender, text) {
            const chatMessages = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.innerHTML = `<span class="font-bold text-purple-400">${sender}:</span> <span class="text-slate-300">${text}</span>`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Reactions & Mini games
        function sendEmoji(emoji) {
            spawnEmoji(emoji);
            if (conn && conn.open) {
                conn.send({ type: 'emoji', emoji });
            }
        }

        function spawnEmoji(emoji) {
            const layer = document.getElementById('emoji-layer');
            const el = document.createElement('div');
            el.className = 'emoji';
            el.innerText = emoji;
            el.style.left = Math.random() * 80 + 10 + '%';
            layer.appendChild(el);
            setTimeout(() => el.remove(), 4000);
        }

        function startMiniGame(type) {
            if (type === 'coinflip') {
                const result = Math.random() < 0.5 ? 'Heads 🪙' : 'Tails 🪙';
                appendChat('System', `Coin flip result: ${result}`);
            } else if (type === 'dice') {
                const result = Math.floor(Math.random() * 6) + 1;
                appendChat('System', `Dice roll result: ${result} 🎲`);
            }
        }

        // Screen share toggle
        document.getElementById('share-btn').addEventListener('click', async () => {
            try {
                const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                if (currentCall && currentCall.peerConnection) {
                    const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
                    if (sender) sender.replaceTrack(screenStream.getVideoTracks()[0]);
                }
                document.getElementById('share-btn').classList.add('hidden');
                document.getElementById('stop-share-btn').classList.remove('hidden');

                screenStream.getVideoTracks()[0].onended = () => stopScreenShare();
            } catch (err) {
                console.error(err);
            }
        });

        document.getElementById('stop-share-btn').addEventListener('click', stopScreenShare);

        function stopScreenShare() {
            navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(camStream => {
                if (currentCall && currentCall.peerConnection) {
                    const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
                    if (sender) sender.replaceTrack(camStream.getVideoTracks()[0]);
                }
                document.getElementById('stop-share-btn').classList.add('hidden');
                document.getElementById('share-btn').classList.remove('hidden');
            });
        }

        // Cursor broadcast
        document.addEventListener('mousemove', (e) => {
            if (conn && conn.open) {
                const container = document.getElementById('video-container').getBoundingClientRect();
                const x = (e.clientX - container.left) / container.width;
                const y = (e.clientY - container.top) / container.height;
                if (x >= 0 && x <= 1 && y >= 0 && y <= 1) {
                    conn.send({ type: 'cursor', x, y });
                }
            }
        });

        function updatePeerCursor(x, y) {
            let cursor = document.getElementById('peer-cursor');
            const layer = document.getElementById('cursor-layer');
            if (!cursor) {
                cursor = document.createElement('div');
                cursor.id = 'peer-cursor';
                cursor.className = 'cursor';
                cursor.innerHTML = `<div class="cursor-label">${peerData.name || 'Friend'}</div>`;
                layer.appendChild(cursor);
            }
            const container = document.getElementById('video-container').getBoundingClientRect();
            cursor.style.left = (x * container.width) + 'px';
            cursor.style.top = (y * container.height) + 'px';
        }

        // Profile Modal
        function openProfile(target) {
            const modal = document.getElementById('profile-modal');
            const nameEl = document.getElementById('modal-name');
            const descEl = document.getElementById('modal-desc');
            const pfpEl = document.getElementById('modal-pfp');

            if (target === 'me') {
                nameEl.innerText = myData.name;
                descEl.innerText = myData.desc || 'No bio provided.';
                pfpEl.src = myData.pfp;
            } else {
                nameEl.innerText = peerData.name || 'Friend';
                descEl.innerText = peerData.desc || 'No bio provided.';
                pfpEl.src = peerData.pfp || 'https://api.dicebear.com/7.x/avataaars/svg?seed=Default';
            }
            modal.style.display = 'flex';
        }

        function closeProfile() {
            document.getElementById('profile-modal').style.display = 'none';
        }
    </script>
</body>
</html>
