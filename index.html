    <style>
        :root { --neon: #a78bfa; --bg: #020617; --accent: #c4b5fd; --discord-dark: #1e1f22; }
        body { 
            background: var(--bg); color: #cbd5e1; min-height: 100vh; margin: 0; 
            overflow: hidden; font-family: 'Inter', sans-serif;
            background-size: cover; background-position: center; transition: background 1s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, rgba(167, 139, 250, 0.1) 0%, rgba(2, 6, 23, 0.9) 100%);
            z-index: -1; pointer-events: none;
        }
        .gpu { transform: translateZ(0); backface-visibility: hidden; will-change: transform, opacity; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.05); }
        .neon-border { border: 1px solid rgba(167, 139, 250, 0.3); box-shadow: 0 0 20px rgba(139, 92, 246, 0.1); }
        .neon-text { text-shadow: 0 0 10px rgba(167, 139, 250, 0.5); color: var(--accent); }
        
        .cursor { position: absolute; width: 12px; height: 12px; border-radius: 50%; pointer-events: none; z-index: 1000; transition: all 0.1s linear; box-shadow: 0 0 10px currentColor; }
        .cursor-label { position: absolute; left: 15px; top: 0; font-size: 10px; white-space: nowrap; color: #fff; font-weight: bold; }
        
        .emoji { position: absolute; pointer-events: none; z-index: 100; animation: fall 4s linear forwards; font-size: 2rem; opacity: 0.8; }
        @keyframes fall { from { transform: translateY(-10vh) rotate(0deg); opacity: 0.8; } to { transform: translateY(110vh) rotate(360deg); opacity: 0; } }
        
        .dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); transition: all 0.4s ease; opacity: 0.8; z-index: 1000; width: 90%; max-width: 700px; }
        .fullscreen-active { position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; z-index: 9999 !important; background: black !important; border-radius: 0 !important; border: none !important; }
        .fullscreen-active video { width: 100vw !important; height: 100vh !important; object-fit: contain !important; }
        
        .profile-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 3000; display: none; width: 500px; max-width: 90vw; }
        .visualizer-bar { width: 3px; height: 10px; background: var(--neon); animation: bounce 0.5s ease-in-out infinite alternate; }
        @keyframes bounce { from { height: 5px; } to { height: 20px; } }
        
        .sidebar { height: 100vh; transition: all 0.3s ease; }
        .game-frame { width: 100%; height: 100%; border: none; }
        .notification { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        .message-bubble { max-width: 80%; word-wrap: break-word; position: relative; }
        .reaction { position: absolute; bottom: -10px; right: 5px; background: rgba(0,0,0,0.5); border-radius: 10px; padding: 0 4px; font-size: 10px; }
        
        #dm-panel { 
            position: fixed; right: -400px; top: 0; width: 400px; height: 100vh; 
            background: var(--discord-dark); backdrop-filter: blur(20px); 
            border-left: 1px solid rgba(167, 139, 250, 0.3); transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            z-index: 2000; display: flex; flex-direction: column; 
        }
        #dm-panel.open { right: 0; }

        #notif-bell-container { position: fixed; top: 20px; right: 20px; z-index: 5000; cursor: pointer; }
        #notif-bell { font-size: 24px; transition: transform 0.2s; }
        #notif-bell.ring { animation: bellRing 0.5s infinite; }
        @keyframes bellRing { 0% { transform: rotate(0); } 25% { transform: rotate(15deg); } 50% { transform: rotate(-15deg); } 100% { transform: rotate(0); } }
        #notif-dropdown { 
            position: absolute; top: 40px; right: 0; width: 300px; 
            background: var(--discord-dark); border: 1px solid rgba(167, 139, 250, 0.3); 
            border-radius: 1rem; display: none; flex-direction: column; 
            max-height: 400px; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>

    <script>
        let peer = null, currentCall = null, dataConn = null;
        let myData = { name: "", pfp: "https://api.dicebear.com/7.x/avataaars/svg?seed=Default", banner: "", bio: "", song: "", cursorColor: "#a78bfa" };
        let peerData = { name: "Friend", pfp: "https://api.dicebear.com/7.x/avataaars/svg?seed=Default", banner: "", bio: "", song: "", cursorColor: "#a78bfa" };
        let secretKey = "ultra-secret-key";
        let localStream = null, screenStream = null;
        let isMuted = false, isDeafened = false, isCamOff = false;
        let callStartTime = null;
        let pendingCall = null;
        let activeDMUser = null;
        let notificationCount = 0;
        let friendsList = JSON.parse(localStorage.getItem('mykels_friends') || '[]');

        function saveProfile() { localStorage.setItem('mykels_profile', JSON.stringify(myData)); }
        function saveFriends() { localStorage.setItem('mykels_friends', JSON.stringify(friendsList)); }
        
        function loadProfile() {
            const saved = localStorage.getItem('mykels_profile');
            if (saved) {
                myData = JSON.parse(saved);
                document.getElementById('user-name').value = myData.name;
                document.getElementById('user-desc').value = myData.bio;
                document.getElementById('user-song').value = myData.song;
                document.getElementById('user-cursor-color').value = myData.cursorColor;
                document.getElementById('pfp-preview').src = myData.pfp;
                return true;
            }
            return false;
        }

        window.onload = () => {
            localStorage.removeItem('mykels_auth');
            const isAuthorized = localStorage.getItem('mykels_auth') === 'true';
            if (loadProfile() && isAuthorized) {
                bypassJoinScreen();
            }
            notify("SYSTEM RECOVERY v11.0: ALL MODALS PURGED. INSTANT-JOIN ACTIVE.", "update");
        };

        function bypassJoinScreen() {
            document.getElementById('join-screen').classList.add('hidden');
            document.getElementById('meeting-room').classList.remove('hidden');
            initPeer();
        }

        function notify(text, type) {
            const center = document.getElementById('notification-center');
            const div = document.createElement('div');
            div.className = `notification glass p-4 rounded-2xl border-l-4 ${type === 'update' ? 'border-purple-500' : 'border-blue-500'} shadow-xl text-xs`;
            div.innerHTML = `<div class="font-bold mb-1 uppercase">${type}</div><div>${text}</div>`;
            center.appendChild(div);
            setTimeout(() => div.remove(), 5000);
        }

        function pushNotification(text, data = null) {
            notificationCount++;
            const badge = document.getElementById('notif-badge');
            badge.innerText = notificationCount;
            badge.classList.remove('hidden');
            document.getElementById('notif-bell').classList.add('ring');

            const list = document.getElementById('notif-list');
            const item = document.createElement('div');
            item.className = "p-2 bg-slate-800 rounded-lg text-[10px] cursor-pointer hover:bg-slate-700 transition flex justify-between items-center";
            item.innerHTML = `<span>${text}</span> <span class="text-purple-400 font-bold">View</span>`;
            item.onclick = () => {
                if (data && data.type === 'friend_req') {
                    acceptFriendRequest(data.user, data.peerId);
                }
                item.remove();
                updateBadge();
            };
            list.prepend(item);
        }

        function updateBadge() {
            notificationCount--;
            const badge = document.getElementById('notif-badge');
            if (notificationCount <= 0) {
                badge.classList.add('hidden');
                document.getElementById('notif-bell').classList.remove('ring');
            } else {
                badge.innerText = notificationCount;
            }
        }

        function toggleNotifs() {
            const dropdown = document.getElementById('notif-dropdown');
            dropdown.style.display = dropdown.style.display === 'flex' ? 'none' : 'flex';
        }

        document.getElementById('pfp-btn').onclick = () => document.getElementById('pfp-upload').click();
        document.getElementById('pfp-upload').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                document.getElementById('pfp-preview').src = ev.target.result;
                myData.pfp = ev.target.result;
                saveProfile();
            };
            reader.readAsDataURL(file);
        };

        document.getElementById('banner-upload').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => { myData.banner = ev.target.result; saveProfile(); };
            reader.readAsDataURL(file);
        };

        document.getElementById('room-pass').oninput = (e) => {
            const val = e.target.value.toLowerCase().trim();
            if (val === "leave by whirr") {
                localStorage.setItem('mykels_auth', 'true');
                const startBtn = document.getElementById('start-btn');
                startBtn.disabled = false;
                startBtn.classList.replace('bg-slate-800', 'bg-purple-600');
                startBtn.classList.replace('text-slate-400', 'text-white');
                startBtn.classList.remove('cursor-not-allowed');
                setTimeout(() => startBtn.click(), 500);
            } else {
                const startBtn = document.getElementById('start-btn');
                startBtn.disabled = true;
                startBtn.classList.replace('bg-purple-600', 'bg-slate-800');
                startBtn.classList.replace('text-white', 'text-slate-400');
                startBtn.classList.add('cursor-not-allowed');
            }
        };

        async function initPeer() {
            try { 
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true }); 
            } catch (e) { console.log("Media denied"); }

            peer = new Peer({
                config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] }
            });
            
            peer.on('open', (id) => {
                const words = ["cool", "fast", "slow", "ready", "smart", "light", "bold", "fresh", "sharp", "clear"];
                const randomID = words[Math.floor(Math.random()*words.length)] + "-" + Math.floor(1000 + Math.random() * 9000);
                document.getElementById('my-name-display').innerText = myData.name;
                document.getElementById('my-id-display').innerText = "ID: " + randomID;
                document.getElementById('my-pfp-display').src = myData.pfp;
                if (myData.banner) document.getElementById('banner-display').style.backgroundImage = `url('${myData.banner}')`;
                renderFriendsList();
            });

            peer.on('call', (call) => { 
                // ABSOLUTE INSTANT ANSWER: No modals, no ringing, no waiting.
                call.answer(localStream);
                handleCall(call);
            });

            peer.on('connection', (conn) => handleDataConnection(conn));
        }

        document.getElementById('start-btn').onclick = async () => {
            myData.name = document.getElementById('user-name').value;
            myData.bio = document.getElementById('user-desc').value;
            myData.song = document.getElementById('user-song').value;
            myData.cursorColor = document.getElementById('user-cursor-color').value;
            if (!myData.name) return alert("Enter your name!");
            saveProfile();
            document.getElementById('join-screen').classList.add('hidden');
            document.getElementById('meeting-room').classList.remove('hidden');
            initPeer();
        };

        document.getElementById('connect-btn').onclick = async () => {
            const peerId = document.getElementById('peer-id').value.trim();
            if (!peerId) return alert("Enter a valid Friend ID!");
            
            notify("Connecting Instantly...", "info");
            const call = peer.call(peerId, localStream);
            const conn = peer.connect(peerId);
            handleCall(call);
            handleDataConnection(conn);
        };

        function handleCall(call) {
            currentCall = call;
            callStartTime = new Date();
            document.getElementById('status').innerText = "Live";
            document.getElementById('status').classList.replace('text-slate-400', 'text-green-400');
            
            // REMOVED: call-overlay.classList.remove('hidden')
            // The "End Call" overlay is now DISABLED by default.

            call.on('stream', (remoteStream) => { 
                document.getElementById('remote-video').srcObject = remoteStream; 
                document.getElementById('remote-video').play();
            });

            call.on('close', () => {
                document.getElementById('status').innerText = "Disconnected";
                document.getElementById('status').classList.replace('text-green-400', 'text-slate-500');
                logCall();
            });
        }

        document.getElementById('end-call-btn').onclick = () => {
            if (currentCall) {
                currentCall.close();
                currentCall = null;
                document.getElementById('status').innerText = "Disconnected";
                document.getElementById('status').classList.replace('text-green-400', 'text-slate-500');
                logCall();
            }
        };

        function logCall() {
            const endTime = new Date();
            const duration = Math.round((endTime - callStartTime) / 1000);
            const logEntry = document.createElement('div');
            logEntry.className = "p-2 bg-slate-900/50 rounded border border-slate-800 mb-2";
            logEntry.innerHTML = `<b class="text-purple-400">Call with ${peerData.name}</b><br>Duration: ${duration}s`;
            document.getElementById('call-logs').prepend(logEntry);
        }

        function encrypt(text) { return CryptoJS.AES.encrypt(text, secretKey).toString(); }
        function decrypt(cipher) {
            try { return CryptoJS.AES.decrypt(cipher, secretKey).toString(CryptoJS.enc.Utf8); } 
            catch (e) { return "[Decryption Error]"; }
        }

        function handleDataConnection(conn) {
            dataConn = conn;
            conn.on('open', () => {
                conn.send(encrypt(JSON.stringify({ type: 'metadata', data: myData })));
            });
            conn.on('data', (data) => {
                try {
                    const decrypted = JSON.parse(decrypt(data));
                    if (decrypted.type === 'metadata') {
                        peerData = decrypted.data;
                        document.getElementById('peer-display').classList.remove('hidden');
                        document.getElementById('peer-name-display').innerText = peerData.name;
                        document.getElementById('peer-pfp-display').src = peerData.pfp;
                        addFriend(peerData);
                    } else if (decrypted.type === 'friend_req') {
                        pushNotification(`Friend Request from ${decrypted.user}!`, { type: 'friend_req', user: decrypted.user, peerId: decrypted.peerId });
                        notify(`Friend Request from ${decrypted.user}!`, "request");
                    } else if (decrypted.type === 'chat') {
                        addChatMessage(decrypted.user, decrypted.msg, decrypted.type_chat);
                        if (activeDMUser === decrypted.user) {
                            addChatMessage(decrypted.user, decrypted.msg, decrypted.type_chat, 'dm');
                        }
                    } else if (decrypted.type === 'emoji') {
                        spawnEmoji(decrypted.emoji);
                    } else if (decrypted.type === 'cursor') {
                        moveCursor(decrypted.user, decrypted.x, decrypted.y, decrypted.color);
                    } else if (decrypted.type === 'yt_sync') {
                        loadYTVideo(decrypted.url, false);
                    } else if (decrypted.type === 'yt_open') {
                        document.getElementById('youtube-modal').classList.remove('hidden');
                        loadYTVideo(decrypted.url, false);
                    }
                } catch(e) { console.log("Data decrypt failed"); }
            });
        }

        function addFriend(user) {
            if (friendsList.some(f => f.name === user.name)) return;
            friendsList.push(user);
            saveFriends();
            renderFriendsList();
        }

        function renderFriendsList() {
            const list = document.getElementById('friends-list');
            list.innerHTML = '';
            friendsList.forEach(user => {
                const div = document.createElement('div');
                div.className = "flex items-center gap-3 p-2 hover:bg-slate-800 rounded-xl cursor-pointer transition";
                div.innerHTML = `<img src="${user.pfp}" class="w-8 h-8 rounded-full object-cover"><span class="text-xs">${user.name}</span><span class="ml-auto text-[8px] text-green-500 font-bold">ONLINE</span><button onclick="openDM('${user.name}')" class="ml-2 text-[10px] bg-slate-700 p-1 rounded">DM</button>`;
                div.onclick = (e) => { if(e.target.tagName !== 'BUTTON') openProfile('peer'); };
                list.appendChild(div);
            });
        }

        async function acceptFriendRequest(userName, peerId) {
            const conn = peer.connect(peerId);
            handleDataConnection(conn);
            conn.on('open', () => {
                conn.send(encrypt(JSON.stringify({ type: 'friend_req_accepted', user: myData.name })));
                notify(`Accepted ${userName}!`, "info");
            });
        }

        document.getElementById('add-friend-btn').onclick = () => {
            const id = prompt("Enter Friend ID to send request:");
            if (id) {
                const conn = peer.connect(id);
                handleDataConnection(conn);
                conn.on('open', () => {
                    conn.send(encrypt(JSON.stringify({ type: 'friend_req', user: myData.name, peerId: peer.id })));
                    notify("Friend request sent!", "info");
                });
            }
        };

        function sendChatMessage(inputId, btnId) {
            const input = document.getElementById(inputId);
            const msg = input.value;
            if (!msg || !dataConn) return;
            dataConn.send(encrypt(JSON.stringify({ type: 'chat', user: myData.name, msg: msg, type_chat: 'text' })));
            addChatMessage("You", msg, 'text');
            input.value = "";
        }

        document.getElementById('send-msg').onclick = () => sendChatMessage('chat-input', 'send-msg');
        document.getElementById('dock-send-msg').onclick = () => sendChatMessage('dock-chat-input', 'dock-send-msg');

        function triggerFileUpload(type) {
            document.getElementById('file-upload').click();
        }

        function sendFile() {
            const file = document.getElementById('file-upload').files[0];
            if (!file || !dataConn) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const base64 = e.target.result;
                const type = file.type.startsWith('image') ? 'image' : 'video';
                dataConn.send(encrypt(JSON.stringify({ type: 'chat', user: myData.name, msg: base64, type_chat: type })));
                addChatMessage("You", base64, type);
            };
            reader.readAsDataURL(file);
        }

        function addChatMessage(user, msg, type = 'text', target = 'main') {
            const div = document.createElement('div');
            div.className = `message-bubble flex flex-col ${user === 'You' ? 'items-end' : 'items-start'}`;
            let content = '';
            if (type === 'text') content = `<span class="bg-slate-800 p-2 rounded-lg text-white">${msg}</span>`;
            else if (type === 'image') content = `<img src="${msg}" class="max-w-xs rounded-lg border border-slate-700">`;
            else if (type === 'video') content = `<video src="${msg}" controls class="max-w-xs rounded-lg border border-slate-700"></video>`;
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            div.innerHTML = `<span class="text-purple-400 font-bold text-[10px]">${user} <span class="text-slate-500 font-normal">${time}</span></span>${content}<div class="reaction cursor-pointer" onclick="react(this)">❤️ 0</div>`;
            
            const container = (target === 'dm') ? document.getElementById('dm-messages') : document.getElementById('chat-messages');
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function react(el) {
            let count = parseInt(el.innerText.split(' ')[1]);
            el.innerText = `❤️ ${count + 1}`;
        }

        window.onmousemove = (e) => {
            if (!dataConn) return;
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            dataConn.send(encrypt(JSON.stringify({ type: 'cursor', user: myData.name, x, y, color: myData.cursorColor })));
        };

        function moveCursor(user, x, y, color) {
            let cursor = document.getElementById('cursor-' + user.replace(/\s/g, ''));
            if (!cursor) {
                cursor = document.createElement('div');
                cursor.id = 'cursor-' + user.replace(/\s/g, '');
                cursor.className = "cursor";
                cursor.innerHTML = `<div class="cursor-label">${user}</div>`;
                document.getElementById('cursor-layer').appendChild(cursor);
            }
            cursor.style.left = (x * 100) + "%";
            cursor.style.top = (y * 100) + "%";
            cursor.style.color = color;
            cursor.style.backgroundColor = color;
        }

        function spawnEmoji(emoji) {
            const el = document.createElement('div');
            el.className = "emoji";
            el.innerText = emoji;
            el.style.left = Math.random() * 100 + "vw";
            document.getElementById('emoji-layer').appendChild(el);
            setTimeout(() => el.remove(), 4000);
        }

        function sendEmoji(emoji) {
            if (!dataConn) return;
            dataConn.send(encrypt(JSON.stringify({ type: 'emoji', emoji: emoji })));
            spawnEmoji(emoji);
        }

        function sendSfx(sound) {
            if (!dataConn) return;
            const sfx = { airhorn: '📢 AIRHORN!', bruh: '🤨 BRUH!' };
            notify(sfx[sound] || "SFX Triggered!", "info");
            dataConn.send(encrypt(JSON.stringify({ type: 'chat', user: 'SYSTEM', msg: sfx[sound], type_chat: 'text' })));
        }

        function startMiniGame(game) {
            if (game === 'pacman') {
                document.getElementById('game-title').innerText = "Pac-Hacker Arcade";
                document.getElementById('game-container').innerHTML = `<iframe src="https://pacman-game.com/" class="game-frame"></iframe>`;
                document.getElementById('game-modal').classList.remove('hidden');
            } else {
                if (!dataConn) return;
                const val = game === 'coinflip' ? (Math.random() > 0.5 ? 'Heads' : 'Tails') : Math.floor(Math.random() * 6) + 1;
                dataConn.send(encrypt(JSON.stringify({ type: 'game', game: game, val: val })));
            }
        }

        function closeGame() { document.getElementById('game-modal').classList.add('hidden'); }

        document.getElementById('dock-mute').onclick = () => {
            if (localStream) {
                isMuted = !isMuted;
                localStream.getAudioTracks()[0].enabled = !isMuted;
                document.getElementById('dock-mute').classList.toggle('bg-red-600');
                document.getElementById('dock-mute').innerText = isMuted ? '🔇' : '🎤';
            }
        };

        document.getElementById('dock-deafen').onclick = () => {
            if (localStream) {
                isDeafened = !isDeafened;
                localStream.getAudioTracks().forEach(t => t.enabled = !isDeafened);
                document.getElementById('dock-deafen').classList.toggle('bg-red-600');
                document.getElementById('dock-deafen').innerText = isDeafened ? '🚫' : '🎧';
            }
        };

        document.getElementById('dock-cam').onclick = () => {
            if (localStream) {
                isCamOff = !isCamOff;
                localStream.getVideoTracks()[0].enabled = !isCamOff;
                document.getElementById('dock-cam').classList.toggle('bg-red-600');
                document.getElementById('dock-cam').innerText = isCamOff ? '🚫' : '📷';
            }
        };

        document.getElementById('share-btn').onclick = async () => {
            try {
                screenStream = await navigator.mediaDevices.getDisplayMedia({ video: { width: 1920, height: 1080 }, audio: true });
                if (currentCall && currentCall.peerConnection) {
                    const videoSender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
                    if (videoSender) {
                        videoSender.replaceTrack(screenStream.getVideoTracks()[0]);
                    }
                }
                document.getElementById('share-btn').classList.add('hidden');
                document.getElementById('stop-share-btn').classList.remove('hidden');
                document.getElementById('status').innerText = "Streaming 4K";
            } catch (err) { alert("Share failed: " + err.message); }
        };

        document.getElementById('stop-share-btn').onclick = () => {
            if (screenStream) {
                screenStream.getTracks().forEach(t => t.stop());
                if (currentCall && currentCall.peerConnection && localStream) {
                    const videoSender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
                    if (videoSender) {
                        videoSender.replaceTrack(localStream.getVideoTracks()[0]);
                    }
                }
                document.getElementById('stop-share-btn').classList.add('hidden');
                document.getElementById('share-btn').classList.remove('hidden');
                document.getElementById('status').innerText = "Live";
            }
        };

        document.getElementById('fullscreen-btn').onclick = () => {
            const v = document.getElementById('video-container');
            v.classList.toggle('fullscreen-active');
            document.getElementById('exit-fs-btn').style.display = v.classList.contains('fullscreen-active') ? 'block' : 'none';
            document.getElementById('fullscreen-btn').innerText = v.classList.contains('fullscreen-active') ? "🔳 Exit Fullscreen" : "🔳 Watch Fullscreen";
        };

        document.getElementById('exit-fs-btn').onclick = () => {
            const v = document.getElementById('video-container');
            v.classList.remove('fullscreen-active');
            document.getElementById('exit-fs-btn').style.display = 'none';
            document.getElementById('fullscreen-btn').innerText = "🔳 Watch Fullscreen";
        };

        document.getElementById('leave-btn').onclick = () => {
            if (confirm("Leave Space?")) window.location.reload();
        };

        function openProfile(user) {
            const modal = document.getElementById('profile-modal');
            const data = (user === 'me') ? myData : peerData;
            document.getElementById('modal-name').innerText = data.name;
            document.getElementById('modal-bio').innerText = data.bio || "No bio provided.";
            document.getElementById('modal-pfp').src = data.pfp;
            document.getElementById('modal-banner').style.backgroundImage = data.banner ? `url('${data.banner}')` : 'none';
            document.getElementById('modal-song-name').innerText = data.song ? `🎵 ${data.song}` : "No song playing...";
            modal.style.display = 'block';
        }

        function closeProfile() { document.getElementById('profile-modal').style.display = 'none'; }

        document.getElementById('youtube-btn').onclick = () => {
            document.getElementById('youtube-modal').classList.remove('hidden');
            if (dataConn) {
                dataConn.send(encrypt(JSON.stringify({ type: 'yt_open' })));
            }
        };
        function closeYouTube() { document.getElementById('youtube-modal').classList.add('hidden'); }
        
        document.getElementById('yt-load-btn').onclick = () => {
            const url = document.getElementById('yt-url').value;
            if (!url) return;
            loadYTVideo(url, true);
        };

        function loadYTVideo(url, sync) {
            let videoId = "";
            if (url.includes('v=')) videoId = url.split('v=')[1].split('&')[0];
            else if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1];
            if (videoId) {
                document.getElementById('yt-container').innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" class="w-full h-full aspect-video" allow="autoplay"></iframe>`;
                if (sync && dataConn) {
                    dataConn.send(encrypt(JSON.stringify({ type: 'yt_sync', url: url })));
                }
            }
        }

        function openDM(userName) {
            activeDMUser = userName;
            document.getElementById('dm-name').innerText = userName;
            document.getElementById('dm-panel').classList.add('open');
            document.getElementById('dm-messages').innerHTML = '';
            notify(`Chat opened with ${userName}`, "info");
        }

        document.getElementById('close-dm').onclick = () => {
            document.getElementById('dm-panel').classList.remove('open');
            activeDMUser = null;
        };

        document.getElementById('dm-send').onclick = () => {
            const input = document.getElementById('dm-input');
            const msg = input.value;
            if (!msg || !dataConn || !activeDMUser) return;
            dataConn.send(encrypt(JSON.stringify({ type: 'chat', user: myData.name, msg: msg, type_chat: 'text' })));
            const div = document.createElement('div');
            div.className = "message-bubble flex flex-col items-end";
            div.innerHTML = `<span class="bg-purple-600 p-2 rounded-lg text-white">${msg}</span>`;
            document.getElementById('dm-messages').appendChild(div);
            input.value = "";
        };
    </script>
</body>
</html>
