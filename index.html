<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MYKELS SPACE | ABSOLUTE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root { --neon: #a78bfa; --bg: #020617; }
        body { 
            background: var(--bg); color: #cbd5e1; min-height: 100vh; margin: 0; 
            overflow-x: hidden; font-family: 'Inter', sans-serif;
            background-size: cover; background-position: center; transition: background 1s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(to bottom, rgba(2, 6, 23, 0.4), rgba(2, 6, 23, 0.9));
            z-index: -1; pointer-events: none;
        }
        .gpu { transform: translateZ(0); backface-visibility: hidden; will-change: transform, opacity; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.05); }
        .neon-border { border: 1px solid rgba(167, 139, 250, 0.3); box-shadow: 0 0 20px rgba(139, 92, 246, 0.1); }
        .neon-text { text-shadow: 0 0 10px rgba(167, 139, 250, 0.5); color: #c4b5fd; }
        .cursor { position: absolute; width: 12px; height: 12px; background: var(--neon); border-radius: 50%; pointer-events: none; z-index: 1000; transition: all 0.1s linear; box-shadow: 0 0 10px var(--neon); }
        .cursor-label { position: absolute; left: 15px; top: 0; font-size: 10px; white-space: nowrap; color: #fff; font-weight: bold; }
        .emoji { position: absolute; pointer-events: none; z-index: 100; animation: fall 4s linear forwards; font-size: 2rem; opacity: 0.8; }
        @keyframes fall { from { transform: translateY(-10vh) rotate(0deg); opacity: 0.8; } to { transform: translateY(110vh) rotate(360deg); opacity: 0; } }
        .dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); transition: all 0.4s ease; opacity: 0.8; z-index: 1000; width: 90%; max-width: 600px; }
        .fullscreen-active { position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; z-index: 9999 !important; background: black !important; border-radius: 0 !important; border: none !important; }
        .fullscreen-active video { width: 100vw !important; height: 100vh !important; object-fit: contain !important; }
        .fullscreen-active #banner-display { display: none !important; }
        .profile-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 3000; display: none; }
        .incoming-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 4000; display: none; }
    </style>
</head>
<body class="flex items-center justify-center p-4" style="background-image: url('https://64.media.tumblr.com/2483e015d5da16768b0b8aedc4514872/tumblr_mwsonxHV4N1qi6frjo1_540.png');">
    <div class="overlay"></div>

    <!-- JOIN SCREEN -->
    <div id="join-screen" class="gpu glass p-10 rounded-[2.5rem] neon-border w-full max-w-md flex flex-col gap-8 z-10">
        <div class="text-center">
            <h1 class="text-4xl font-light neon-text italic tracking-tight mb-1">mykels space</h1>
            <p class="text-slate-500 text-[10px] uppercase tracking-widest font-medium">Absolute P2P Suite</p>
        </div>
        <div class="flex flex-col gap-6">
            <div class="flex flex-col gap-2">
                <label class="text-[10px] font-medium text-slate-500 uppercase ml-1">Identity</label>
                <input id="user-name" class="bg-slate-900/40 border border-slate-800 p-4 rounded-2xl text-slate-200 outline-none transition" placeholder="Who are you?">
            </div>
            <div class="flex flex-col gap-4 p-4 rounded-2xl bg-slate-900/30 border border-slate-800">
                <label class="text-[10px] font-medium text-slate-500 uppercase text-center">Profile Setup</label>
                <div class="flex flex-col items-center gap-4">
                    <div class="relative">
                        <img id="pfp-preview" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Default" class="w-20 h-20 rounded-full border border-slate-700 p-1 object-cover opacity-80">
                        <input type="file" id="pfp-upload" accept="image/*" class="hidden">
                        <button id="pfp-btn" class="absolute -bottom-2 -right-2 bg-slate-800 text-slate-400 p-2 rounded-full text-xs hover:text-white transition">📷</button>
                    </div>
                    <div class="flex flex-col gap-2 w-full">
                        <input type="file" id="banner-upload" accept="image/*" class="bg-slate-900/60 border border-slate-800 p-2 rounded-lg text-xs text-slate-300 outline-none cursor-pointer">
                        <input id="user-desc" class="bg-slate-900/60 border border-slate-800 p-2 rounded-lg text-xs text-slate-300 outline-none" placeholder="About me... (Bio)">
                    </div>
                </div>
            </div>
            <div class="flex flex-col gap-2">
                <label class="text-[10px] font-medium text-slate-500 uppercase ml-1">Access Code</label>
                <input id="room-pass" type="text" class="bg-slate-900/40 border border-slate-800 p-4 rounded-2xl text-slate-200 outline-none transition" placeholder="Type room code or custom ID...">
            </div>
            <button id="start-btn" class="bg-slate-800 text-slate-400 p-4 rounded-2xl font-medium transition-all active:scale-95 shadow-sm cursor-pointer hover:bg-purple-900 hover:text-white">Enter Space</button>
        </div>
    </div>

    <!-- MEETING ROOM -->
    <div id="meeting-room" class="hidden w-full max-w-7xl flex flex-col gap-6 h-screen max-h-[95vh]">
        <div class="flex justify-between items-center glass p-4 rounded-2xl neon-border gpu">
            <div class="flex items-center gap-3 cursor-pointer" onclick="openProfile('me')">
                <img id="my-pfp-display" class="w-10 h-10 rounded-full bg-slate-800 border border-slate-700 object-cover opacity-80">
                <div class="flex flex-col">
                    <p id="my-name-display" class="font-medium text-sm text-slate-300"></p>
                    <p id="my-id-display" class="text-[10px] text-slate-500 font-mono"></p>
                </div>
            </div>
            <div class="flex gap-2">
                <input id="peer-id" class="bg-slate-900/50 border border-slate-800 p-2 rounded-xl text-slate-300 text-sm outline-none" placeholder="Friend's ID...">
                <button id="connect-btn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl font-medium text-sm transition">Call Friend</button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 h-full overflow-hidden">
            <div id="video-container" class="lg:col-span-3 relative aspect-video bg-black rounded-[2rem] overflow-hidden border border-slate-800 shadow-2xl gpu">
                <div id="banner-display" class="absolute top-0 left-0 w-full h-16 bg-cover bg-center opacity-50 border-b border-slate-800 z-20"></div>
                <video id="remote-video" autoplay class="w-full h-full object-contain relative z-10" playsinline></video>
                <div id="cursor-layer"></div>
                <div id="emoji-layer"></div>
                <div id="status" class="absolute top-6 right-6 px-3 py-1 rounded-full text-[10px] font-bold uppercase bg-slate-900/80 text-slate-500 border border-slate-800 z-20">Disconnected</div>
            </div>
            <div class="flex flex-col gap-4 h-full">
                <div class="glass p-4 rounded-3xl border border-slate-800 flex flex-col h-1/2">
                    <h3 class="text-xs font-medium text-slate-500 uppercase mb-2">Encrypted Chat</h3>
                    <div id="chat-messages" class="flex-1 overflow-y-auto text-xs space-y-2 mb-2 pr-2"></div>
                    <div class="flex gap-2">
                        <input id="chat-input" class="bg-slate-900/50 border border-slate-800 p-2 rounded-lg text-slate-300 text-xs w-full outline-none" placeholder="Write something...">
                        <button id="send-msg" class="bg-slate-800 p-2 rounded-lg text-xs hover:bg-purple-900 transition">Send</button>
                    </div>
                </div>
                <div class="glass p-4 rounded-3xl border border-slate-800 flex flex-col gap-3">
                    <h3 class="text-xs font-medium text-slate-500 uppercase mb-1">Controls</h3>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="sendSfx('airhorn')" class="bg-slate-900/50 p-2 rounded-lg text-[10px] hover:bg-slate-700 transition">📢 Airhorn</button>
                        <button onclick="sendSfx('bruh')" class="bg-slate-900/50 p-2 rounded-lg text-[10px] hover:bg-slate-700 transition">🤨 Bruh</button>
                        <button onclick="startMiniGame('coinflip')" class="bg-slate-900/50 p-2 rounded-lg text-[10px] hover:bg-slate-700 transition">🪙 Flip</button>
                        <button onclick="startMiniGame('dice')" class="bg-slate-900/50 p-2 rounded-lg text-[10px] hover:bg-slate-700 transition">🎲 Dice</button>
                    </div>
                    <div class="flex flex-col gap-2">
                        <button id="share-btn" class="w-full bg-slate-100 text-slate-900 p-3 rounded-xl font-bold hover:bg-white transition flex items-center justify-center gap-2 shadow-lg text-xs">
                            <span>📺</span> Share Screen
                        </button>
                        <button id="stop-share-btn" class="hidden w-full bg-red-600 text-white p-3 rounded-xl font-bold hover:bg-red-500 transition flex items-center justify-center gap-2 shadow-lg text-xs">
                            <span>🛑</span> Stop Sharing
                        </button>
                        <button id="fullscreen-btn" class="w-full bg-slate-800 text-slate-300 p-3 rounded-xl font-bold hover:bg-slate-700 transition flex items-center justify-center gap-2 text-xs">
                            <span>⛶</span> Fullscreen
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- INCOMING CALL MODAL -->
    <div id="incoming-modal" class="incoming-modal glass p-8 rounded-3xl border border-purple-500/30 text-center flex flex-col gap-4 shadow-2xl">
        <h2 class="text-xl font-light neon-text">Incoming Call...</h2>
        <p id="caller-id-display" class="text-sm font-mono text-slate-300"></p>
        <div class="flex gap-4 justify-center mt-2">
            <button id="accept-call-btn" class="bg-green-600 hover:bg-green-500 text-white px-6 py-2 rounded-xl text-sm font-bold transition">Accept</button>
            <button id="reject-call-btn" class="bg-red-600 hover:bg-red-500 text-white px-6 py-2 rounded-xl text-sm font-bold transition">Reject</button>
        </div>
    </div>

    <audio id="ring-audio" src="https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg" loop></audio>

    <script>
        let peer, localStream, activeConn, incomingCallObj = null;
        const userNameInput = document.getElementById('user-name');
        const roomPassInput = document.getElementById('room-pass');
        const startBtn = document.getElementById('start-btn');
        const pfpPreview = document.getElementById('pfp-preview');
        const pfpUpload = document.getElementById('pfp-upload');
        const bannerUpload = document.getElementById('banner-upload');
        
        let profile = {
            name: '',
            pfp: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Default',
            banner: '',
            desc: ''
        };

        userNameInput.addEventListener('input', () => {
            startBtn.disabled = !userNameInput.value.trim();
        });

        document.getElementById('pfp-btn').addEventListener('click', () => pfpUpload.click());
        pfpUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    profile.pfp = ev.target.result;
                    pfpPreview.src = profile.pfp;
                };
                reader.readAsDataURL(file);
            }
        });

        bannerUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    profile.banner = ev.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        startBtn.addEventListener('click', async () => {
            profile.name = userNameInput.value.trim();
            profile.desc = document.getElementById('user-desc').value.trim();
            const customId = roomPassInput.value.trim() || undefined;

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            } catch (err) {
                console.warn("Camera/Mic access denied or unavailable, starting audio-only or receiver mode.");
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true });
                } catch (e) {
                    localStream = new MediaStream();
                }
            }

            peer = new Peer(customId);

            peer.on('open', (id) => {
                document.getElementById('join-screen').classList.add('hidden');
                document.getElementById('meeting-room').classList.remove('hidden');
                document.getElementById('my-name-display').textContent = profile.name;
                document.getElementById('my-id-display').textContent = 'ID: ' + id;
                document.getElementById('my-pfp-display').src = profile.pfp;
                if(profile.banner) {
                    document.getElementById('banner-display').style.backgroundImage = `url(${profile.banner})`;
                }
                updateStatus('Connected & Ready', 'text-green-400');
            });

            peer.on('connection', (conn) => {
                activeConn = conn;
                setupConnEvents();
            });

            // HANDLE INCOMING CALLS (Ringing system)
            peer.on('call', (call) => {
                incomingCallObj = call;
                document.getElementById('caller-id-display').textContent = `From Peer: ${call.peer}`;
                document.getElementById('incoming-modal').style.display = 'block';
                document.getElementById('ring-audio').play().catch(e => console.log(e));
            });

            peer.on('error', (err) => {
                alert('Peer error: ' + err.type);
            });
        });

        // ACCEPT CALL
        document.getElementById('accept-call-btn').addEventListener('click', () => {
            document.getElementById('incoming-modal').style.display = 'none';
            document.getElementById('ring-audio').pause();
            document.getElementById('ring-audio').currentTime = 0;

            if (incomingCallObj) {
                incomingCallObj.answer(localStream);
                incomingCallObj.on('stream', (remoteStream) => {
                    const remoteVideo = document.getElementById('remote-video');
                    remoteVideo.srcObject = remoteStream;
                    updateStatus('In Call', 'text-green-400');
                });
            }
        });

        // REJECT CALL
        document.getElementById('reject-call-btn').addEventListener('click', () => {
            document.getElementById('incoming-modal').style.display = 'none';
            document.getElementById('ring-audio').pause();
            document.getElementById('ring-audio').currentTime = 0;
            if (incomingCallObj) {
                incomingCallObj.close();
                incomingCallObj = null;
            }
        });

        // OUTGOING CALL
        document.getElementById('connect-btn').addEventListener('click', () => {
            const friendId = document.getElementById('peer-id').value.trim();
            if (!friendId) return alert("Please enter your friend's ID code.");

            updateStatus('Calling...', 'text-yellow-400');

            // Data connection
            activeConn = peer.connect(friendId);
            setupConnEvents();

            // Media call
            const call = peer.call(friendId, localStream);
            call.on('stream', (remoteStream) => {
                const remoteVideo = document.getElementById('remote-video');
                remoteVideo.srcObject = remoteStream;
                updateStatus('In Call', 'text-green-400');
            });
            call.on('close', () => {
                updateStatus('Call Ended', 'text-slate-500');
            });
        });

        function setupConnEvents() {
            activeConn.on('data', (data) => {
                if (data.type === 'chat') {
                    appendChat(data.sender, data.text);
                } else if (data.type === 'sfx') {
                    playSfx(data.name);
                }
            });
        }

        // CHAT SYSTEM
        document.getElementById('send-msg').addEventListener('click', sendChatMessage);
        document.getElementById('chat-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendChatMessage();
        });

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            appendChat('Me', text);
            if (activeConn && activeConn.open) {
                activeConn.send({ type: 'chat', sender: profile.name, text: text });
            }
            input.value = '';
        }

        function appendChat(sender, text) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.innerHTML = `<strong class="text-purple-400">${sender}:</strong> ${escapeHtml(text)}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function updateStatus(text, colorClass) {
            const st = document.getElementById('status');
            st.textContent = text;
            st.className = `absolute top-6 right-6 px-3 py-1 rounded-full text-[10px] font-bold uppercase bg-slate-900/80 border border-slate-800 z-20 ${colorClass}`;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // SCREEN SHARING
        document.getElementById('share-btn').addEventListener('click', async () => {
            try {
                const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                const videoTrack = screenStream.getVideoTracks()[0];
                
                if (peer && activeConn) {
                    // Replace video track in ongoing calls if needed
                }
                
                document.getElementById('share-btn').classList.add('hidden');
                document.getElementById('stop-share-btn').classList.remove('hidden');

                videoTrack.onended = () => stopScreenShare();
            } catch (err) {
                console.error("Screen share error:", err);
            }
        });

        function stopScreenShare() {
            document.getElementById('share-btn').classList.remove('hidden');
            document.getElementById('stop-share-btn').classList.add('hidden');
        }

        document.getElementById('stop-share-btn').addEventListener('click', stopScreenShare);

        // FULLSCREEN
        document.getElementById('fullscreen-btn').addEventListener('click', () => {
            const container = document.getElementById('video-container');
            container.classList.toggle('fullscreen-active');
        });

        function sendSfx(name) {
            if (activeConn && activeConn.open) {
                activeConn.send({ type: 'sfx', name: name });
            }
            playSfx(name);
        }

        function playSfx(name) {
            // Placeholder for sound effects playback
            console.log("Playing SFX:", name);
        }

        function startMiniGame(type) {
            alert("Mini-game launched: " + type);
        }
    </script>
</body>
</html>
